# web 컨테이너 내부 nginx — 정적 프론트 + /api 를 api 컨테이너로 프록시.
# (TLS·서브도메인 라우팅은 EC2 '호스트' nginx 담당 — deploy/nginx.host.conf.example 참고)
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # /api/* → FastAPI(uvicorn). compose 서비스명 'api' 로 DNS 해석.
    location /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
    }

    # SPA 폴백 — 새로고침/직접진입 시 index.html 로.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
