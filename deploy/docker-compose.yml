# 사용: docker compose -f deploy/docker-compose.yml up -d --build
# 리마인더(매일 아침 1회)는 호스트 crontab 으로 실행 — README 참조:
#   0 23 * * * docker compose -f <repo>/deploy/docker-compose.yml run --rm bot python -m backend.jobs.reminder
services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: watchlist-bot
    env_file: ../.env                    # TELEGRAM_*·CLAUDE_CODE_OAUTH_TOKEN(컨테이너 필수)
    environment:
      WATCHLIST_DB: /app/data/watchlist.db
    volumes:
      - ../data:/app/data                # SQLite(state·로그)를 호스트에 보존
    restart: unless-stopped
    # ports 없음 — 롱폴링이라 노출 엔드포인트 0개(작업지시 7절)
