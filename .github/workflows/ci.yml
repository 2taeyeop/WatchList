# CI/CD — 테스트 통과 시 Docker Hub 로 이미지 발행 후 EC2 가 자동 pull. 서버는 clone 불필요.
name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -m pytest tests/ -q

  docker:
    # main 머지(push)에서만 이미지 발행 — 시크릿 DOCKERHUB_USERNAME·DOCKERHUB_TOKEN 필요
    needs: test
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/watchlist-bot:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/watchlist-bot:${{ github.sha }}

  deploy:
    # 이미지 발행 후 EC2 가 새 이미지를 받아 재기동 — 수동 pull 제거.
    # 시크릿 EC2_HOST·EC2_USER·EC2_SSH_KEY 미등록이면 스텝을 건너뛴다(CI 는 초록 유지).
    needs: docker
    if: github.event_name == 'push' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    # secrets 는 if 조건에서 직접 못 읽는다 — env 로 옮겨야 step if 에서 참조 가능.
    env:
      HAS_EC2: ${{ secrets.EC2_HOST }}
    steps:
      - name: EC2 pull & 재기동
        if: env.HAS_EC2 != ''
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            set -e
            cd ~/watchlist-bot
            docker compose pull
            # --wait: 기동 실패를 CI 가 잡게(restart 루프로 조용히 죽는 것 방지)
            docker compose up -d --wait || { docker compose logs --tail 50; exit 1; }
            docker image prune -f
